[project]
name = "verigraph-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0", "pydantic-settings==2.7.1", "httpx==0.28.1", "celery==5.4.0", "redis==5.2.1", "psycopg[binary]==3.3.6", "sqlalchemy==2.0.36", "pgvector==0.3.6", "langgraph==0.2.60"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2", "ruff==0.8.6", "mypy==1.14.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP038"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

